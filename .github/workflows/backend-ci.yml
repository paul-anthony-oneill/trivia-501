name: Backend CI

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
  push:
    branches: [master]
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Build & test
        run: mvn verify -B
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: trivia501
          DB_USER: trivia501
          DB_PASSWORD: trivia501

  # Deploy to Fly.io on merge to master
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - run: flyctl deploy --remote-only
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Flyway migration validation — catches version collisions (e.g. two V46 scripts)
  # before they prevent boot in production. A filename check is enough: Flyway
  # keys on the V<n> prefix, so a duplicate prefix across the .sql and Java
  # migrations is the only collision that blocks startup.
  flyway-check:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for duplicate migration versions
        run: |
          dups=$(find backend/src/main -name 'V*__*' -exec basename {} \; \
            | grep -oE '^V[0-9]+' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "Duplicate Flyway migration versions: $dups"; exit 1
          fi
          echo "No duplicate migration versions."
