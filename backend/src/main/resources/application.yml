spring:
  application:
    name: trivia-501

  datasource:
    # Set DB_URL, DB_USERNAME, and DB_PASSWORD as environment variables.
    # The defaults point to localhost so the app boots without real credentials
    # (e.g. for CI or a quick compile check).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    validate-on-migrate: false
    baseline-on-migrate: true
    baseline-version: 4
    locations: classpath:db/migration

server:
  port: 8080

# go-signer microservice. Leave blank in local dev to disable signing gracefully.
# Set RESULT_SIGNER_URL as a Fly.io secret in production.
result-signer:
  url: ${RESULT_SIGNER_URL:}
  secret: ${RESULT_SIGNER_SECRET:}

# Custom application properties
trivia501:
  data:
    import-path: ${DATA_PATH:../data/transfermarkt}
